<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js"></script>
</head>
<body>

    <!-- Tu contenido HTML -->
    <div id="cuadros-container" class="container">
        <!-- Los cuadros se agregarán aquí por JavaScript -->
    </div>

    <script>
        // Tu configuración de Firebase
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_AUTH_DOMAIN",
            projectId: "sorollainsights",
            storageBucket: "TU_STORAGE_BUCKET",
            messagingSenderId: "TU_MESSAGING_SENDER_ID",
            appId: "TU_APP_ID"
        };

        // Inicializar Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Obtener la colección de cuadros
        db.collection("cuadros").get().then((querySnapshot) => {
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const nombre = data.nombre;
                const foto = data.foto || '/public/img/default.jpeg'; // Foto por defecto si no existe

                // Crear el HTML para cada cuadro
                const cuadroElement = document.createElement('div');
                cuadroElement.classList.add('item');
                cuadroElement.innerHTML = `
                    <img src="${foto}" alt="${nombre}">
                    <div class="desc">
                        <h3 class="c3_tit">${nombre}</h3>
                        <div class="text-end">
                            <a href="/detalle?cuadro=${doc.id}" class="btn btn-custom">Conocer más</a>
                        </div>
                    </div>
                `;
                // Añadir el cuadro al contenedor
                document.getElementById('cuadros-container').appendChild(cuadroElement);
            });
        }).catch((error) => {
            console.log("Error al obtener los documentos: ", error);
        });
    </script>
</body>
</html>
