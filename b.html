<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
    <style>
        /*LETRAS*/
        @font-face {
            font-family: "Safira";
            src: url("../fonts/Safira March Personal Use Only.ttf");
        }
        @font-face {
            font-family: "Lulo";
            src: url("../fonts/Lulo-Clean-W01-One-Bold.ttf");
        }
        .permanent-marker-regular {
            font-family: "Permanent Marker", serif;
            font-weight: 400;
            font-style: normal;
        }
        /*--------------------------------------PORTADA-----------------------------------------------*/
        .portada {
            height: 100vh;
            width: 100%;
            display: flex !important; /* Forzar que sea flexbox */
        }


        .imagen_p1{
            height: 100vh;
            width: 40%;
            background-image: url("img/clotilde.jpg");
            background-size: cover; /* Ajusta la imagen para que quepa completamente */
            background-repeat: no-repeat; /* Evita que la imagen se repita */
            background-position: center; /* Centra la imagen */
        }
        .imagenes{
            height: 100vh;
            width: 60%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #9793b0;
        }
        .imagen2_p1{
            height: 60%;
            width: 70%;
            margin-bottom: 10%;
        }
        .texto_portada{
            font-family: "Lulo",sans-serif;
            font-size: 3.5rem;
            position: absolute;
            bottom: 0;
            color: white;
            margin-left: 2%;
        }

        .portada2 {
            height: 100vh;
            width: 100%;
            display: flex; /* Forzar que sea flexbox */
        }

        .imagen_p2{
            height: 100vh;
            width: 100%;
            background-image: url("img/clotilde.jpg");
            background-size: cover; /* Ajusta la imagen para que quepa completamente */
            background-repeat: no-repeat; /* Evita que la imagen se repita */
            background-position: center; /* Centra la imagen */
        }
    </style>
</head>
<body>
    <div class="portada d-none d-md-block">
        <div class="imagen_p1">
        </div>
        <div class="imagenes">
            <img src="img/Joaquín_Sorolla_y_Bastida_-_Capturing_the_moment_-_Google_Art_Project.jpg" class="imagen2_p1" alt="">
            <h5 class="texto_portada">Instantánea, Biarritz</h5>
        </div>
    </div>
    <div class="portada2 d-block d-sm-none">
        <div class="imagen_p2">
            <h5 class="texto_portada">Instantánea, Biarritz</h5>
        </div>
    </div>
</body>
</html>
