        /* Grid principal */
        .pinterest-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2em;
        }
        
        /* Contenedor del cuadro - Cambio crucial aquí */
        .item-container {
            position: relative;
            padding-bottom: 35px; /* Espacio para el texto */
        }
        
        /* El item real (aquí mantenemos overflow: hidden) */
        .item {
            position: relative;
            aspect-ratio: 1 / 1.25;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            border: 15px solid #f5f5f5;
            border-bottom-width: 35px;
            background-color: #f8f8f8;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        /* Texto SOBRE el borde inferior */
        .texto-sobre-borde {
            position: absolute;
            bottom: 10px; /* Mitad superior del borde grueso */
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 14px;
            color: #2a3d74;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 3;
            white-space: nowrap;
            border: 1px solid #e0e0e0;
        }
        .item:hover {
            transform: scale(1.02);
            transition: transform 0.3s ease;
        }
